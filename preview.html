/* Daily step tracking: a manual entry with a 10,000 step visual goal. */
.steps-card{background:linear-gradient(112deg,#fff,#fff8fa);border:1px solid #f0dde5;border-radius:17px;padding:21px 23px;margin:0 0 19px;box-shadow:var(--shadow)}
.steps-card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap}
.steps-identity{display:flex;align-items:center;gap:11px}
.steps-icon{background:#f9e4ed;color:#b86d8b;width:43px;height:43px;display:grid;place-items:center;border-radius:12px}
.steps-identity h2{font-size:16px;font-weight:800;margin:0 0 4px;color:#564757}
.steps-identity p{margin:0;font-size:12px;color:#9d8994}
.steps-status{border-radius:999px;padding:7px 10px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800}
.steps-status.success{background:#e8f6ed;color:#297e55}.steps-status.pending{background:#fff1d8;color:#946d25}.steps-status.not-set{background:#f6f0f4;color:#8d7888}
.steps-numbers{display:flex;align-items:baseline;gap:10px;margin-top:22px}
.steps-numbers strong{font-size:34px;font-weight:900;color:#3f3442;direction:ltr;unicode-bidi:isolate}
.steps-numbers span{font-size:12px;color:#968995}
.steps-progress{background:#f3e8ed;height:12px;border-radius:22px;overflow:hidden;margin-top:11px;direction:ltr}
.steps-progress>div{height:100%;width:0;background:linear-gradient(90deg,#c982a0,#e2adbe);border-radius:22px;transition:width .2s}
.steps-progress>div.reached{background:linear-gradient(90deg,#57ad79,#80cfa0)}
.steps-progress-foot{display:flex;justify-content:space-between;color:#9b8995;font-size:11px;margin-top:7px;gap:12px}
.steps-entry-form{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.steps-entry-form label{font-size:12px;font-weight:750;color:#6a5c69}
.steps-entry-form input{width:136px;max-width:100%;border:1px solid #e8dbe3;border-radius:9px;background:#fff;padding:10px 12px;font-size:14px;direction:ltr;text-align:center;color:#4f4550}
.steps-entry-form input:focus{outline:2px solid #e5b5c8}
.steps-entry-form input[aria-invalid="true"]{border-color:#bb5666}
.steps-save-note{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#4f986b}
.steps-error{color:#ae3b57;font-size:12px;margin:9px 0 0}
.steps-footnote{margin:13px 0 0;color:#a295a1;font-size:10px;line-height:1.6}
.calendar-step-badge{font-size:9px;line-height:1;white-space:nowrap;font-weight:800;color:#a67e92}
.calendar-step-badge.met{color:#278052}
.calendar-day.selected .calendar-step-badge{color:#fff}
.calendar-steps-recap{background:#fff9fb;border:1px solid #f3e5ea;border-radius:12px;padding:12px 14px;margin:0 0 20px;display:grid;gap:6px;color:#756775;font-size:12px}
.calendar-steps-recap strong{color:#564757;font-size:13px}
.calendar-steps-recap .goal-success{font-weight:800;color:#298457}
.calendar-steps-recap .goal-pending{color:#9e7a37}
.steps-progress.compact{height:7px;margin:3px 0 0}
@media(max-width:580px){.steps-card{padding:16px 14px}.steps-identity h2{font-size:14px}.steps-identity p{font-size:11px}.steps-numbers strong{font-size:30px}.steps-entry-form{display:grid;grid-template-columns:1fr 1fr}.steps-entry-form label{grid-column:1/-1}.steps-entry-form input{width:100%}.steps-entry-form .btn{font-size:11px;padding:10px 7px}.calendar-step-badge{font-size:8px}}

/* Weekly & monthly walking insights. Chart uses semantic buttons, no third-party plotting library. */
.steps-summary-cta{margin-top:15px;display:flex;justify-content:flex-start}
.steps-summary-cta .btn{font-size:12px}
.steps-summary-toolbar{display:flex;align-items:center;justify-content:space-between;gap:17px;margin-bottom:18px;padding:16px 20px;flex-wrap:wrap}
.steps-period-tabs{display:inline-flex;gap:3px;padding:4px;border-radius:12px;background:#f8f0f4;border:1px solid #f1e5ea}
.steps-period-tabs button{border:0;border-radius:9px;background:transparent;padding:10px 15px;color:#9c8494;font-size:12px;font-weight:800;cursor:pointer}
.steps-period-tabs button.active{background:#fff;color:#aa587c;box-shadow:0 2px 6px #704b5b10}
.steps-period-nav{display:flex;align-items:center;gap:10px}
.steps-period-nav strong{font-size:14px;color:#5a4b59;min-width:128px;text-align:center}
.steps-period-nav .icon-btn:disabled{opacity:.3;cursor:not-allowed}
.steps-summary-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 18px}
.steps-summary-stat{border-radius:15px;border:1px solid #efe4e9;box-shadow:var(--shadow);background:#fff;padding:19px 17px;min-width:0;display:grid;gap:9px}
.steps-summary-stat>span{display:flex;align-items:center;gap:7px;font-size:12px;color:#94818d;font-weight:700}
.steps-summary-stat strong{font-size:29px;line-height:1.15;font-weight:850;color:#554454;direction:ltr;text-align:right;unicode-bidi:isolate}
.steps-summary-stat strong small{font-size:13px;color:#93808d}
.steps-summary-stat>small{font-size:11px;color:#9e909a}
.steps-summary-stat.success{background:#f2faf5;border-color:#d3ebdb}
.steps-summary-stat.success strong{color:#2a8758}
.steps-visual-panel,.steps-weekly-breakdown{margin-bottom:18px}
.steps-chart-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}
.steps-chart-head h2{font-size:18px;color:#554657;margin:0 0 6px}
.steps-chart-head p{font-size:11px;line-height:1.7;color:#9b8894;margin:0}
.steps-target-chip{white-space:nowrap;background:#fbeaf1;color:#a25a7c;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}
.steps-chart-scroll{overflow-x:auto;padding:5px 0 12px;scrollbar-color:#ead1db transparent}
.steps-chart{min-width:100%;width:max-content;--goal-height:70%}
.steps-chart-plot{position:relative;display:flex;align-items:stretch;gap:11px;min-height:270px;padding:28px 15px 2px;isolation:isolate}
.step-chart-day{width:64px;min-width:64px;flex:1;height:240px;display:flex;flex-direction:column;align-items:stretch;gap:3px;border:0;background:none;padding:0 4px;color:#736270;cursor:pointer;position:relative;z-index:2}
.step-chart-day:focus-visible{outline:2px solid #c57e9e;outline-offset:2px;border-radius:6px}
.step-chart-value{text-align:center;font-size:10px;font-weight:800;white-space:nowrap;color:#705a69;height:17px}
.step-chart-bar-wrap{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:145px}
.step-chart-bar{display:block;width:100%;max-width:39px;min-height:0;border-radius:7px 7px 3px 3px;transition:height .2s;background:#d9a2b8;box-shadow:inset 0 -2px 2px #8d647510}
.step-chart-bar.achieved{background:linear-gradient(0deg,#56ad7d,#8ccba0)}
.step-chart-bar.missing{background:transparent}
.step-chart-label{text-align:center;font-size:11px;font-weight:700;color:#857482;margin-top:8px}
.step-chart-check{text-align:center;height:16px;font-size:11px;font-weight:900;color:#349466}
.steps-chart.monthly .step-chart-plot{gap:4px;padding-inline:15px}
.steps-chart.monthly .step-chart-day{width:35px;min-width:35px;padding:0 1px}
.steps-chart.monthly .step-chart-bar{max-width:24px;border-radius:5px 5px 2px 2px}
.steps-chart.monthly .step-chart-value{font-size:8px;letter-spacing:-.35px}
.steps-chart.monthly .step-chart-label{font-size:10px}
.steps-goal-guide{position:absolute;left:5px;right:5px;bottom:48px;height:calc((100% - 91px) * var(--goal-height) / 100);border-top:2px dashed #c981a2;pointer-events:none;z-index:1}
.steps-goal-guide span{position:absolute;left:0;top:-17px;direction:ltr;font-size:9px;color:#b76d8c}
.steps-chart-legend{display:flex;flex-wrap:wrap;gap:18px;font-size:11px;color:#96818d;margin-top:12px}
.steps-chart-legend span{display:flex;align-items:center;gap:6px}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px}
.swatch.achieved{background:#65b48b}.swatch.pending{background:#d9a2b8}.swatch.missing{border:1px dashed #b5a5b0;background:white}
.steps-empty-note{background:#fff8fb;border-radius:12px;padding:11px;font-size:12px;color:#a07791;margin-bottom:9px}
.steps-weekly-breakdown .data-table th,.steps-weekly-breakdown .data-table td{white-space:nowrap;font-size:12px}
.steps-week-button{font-size:10px!important;padding:7px 11px!important}
.steps-summary-notes{background:#fff9fb;margin-top:5px}
.steps-summary-notes p{font-size:12px;line-height:1.75;color:#8b7384;margin:0}
@media(max-width:1100px){.steps-summary-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.steps-summary-toolbar{padding:13px;gap:12px;flex-direction:column;align-items:stretch}.steps-period-tabs{display:flex}.steps-period-tabs button{flex:1}.steps-period-nav{justify-content:center}.steps-summary-stats{gap:8px}.steps-summary-stat{padding:13px 10px}.steps-summary-stat strong{font-size:22px}.steps-summary-stat>span{font-size:10px}.steps-summary-stat>small{font-size:9px}.steps-chart-head{display:block}.steps-target-chip{display:inline-flex;margin-top:11px}.step-chart-day{min-width:40px;width:40px}.steps-chart-plot{gap:4px}.steps-summary-cta .btn{font-size:11px;padding:10px}}

/* Hydration & meal calorie insights (v1.1). */
.daily-habits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:19px}
.daily-habits>.steps-card{min-width:0;margin:0}
.daily-habits .steps-card-heading{gap:9px}
.daily-habits .steps-identity{gap:10px}
.daily-habits .steps-numbers{margin-top:18px}
.daily-habits .steps-entry-form{align-items:end}
.water-card{background:linear-gradient(110deg,#fff,#f7fbff);border-color:#dceaf6}
.water-icon{color:#2786b8!important;background:#e7f5fd!important}
.water-progress{background:#e4f0f9}
.water-progress>div{background:linear-gradient(90deg,#80cae9,#419eca)}
.water-progress>div.reached{background:linear-gradient(90deg,#57ad79,#80cfa0)}
.water-quick-add{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:17px 0 2px}
.water-quick-add span{font-size:11px;font-weight:700;color:#786d78}
.water-quick-add .btn{padding:7px 10px;font-size:11px}
.daily-calorie-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#8c7485}
.daily-calorie-summary strong{color:#a0577b;font-size:14px}
.daily-calorie-note{font-size:10px;color:#aaa0a8;margin:9px 0 0;line-height:1.65}
.meal-completeness{font-size:10px;font-weight:700;color:#ac939f}
.meal-completeness.complete{color:#328656}
.meal-calorie-box{background:#fdf8fa;border:1px solid #f3e4eb;border-radius:12px;padding:13px;margin-top:18px}
.meal-calorie-header{display:flex;justify-content:space-between;align-items:center;gap:13px;flex-wrap:wrap}
.meal-calorie-header>div{display:grid;gap:3px}.meal-calorie-header strong{font-size:13px;color:#675465}
.meal-calorie-header span{color:#a496a1;font-size:10px}

.calorie-fraction small{font-size:10px}
.calorie-progress{height:6px;background:#f1e2e9;border-radius:10px;overflow:hidden;margin:10px 0}
.calorie-progress>div{background:#d09ab2;height:100%;border-radius:10px;transition:width .2s}
.calorie-manual-field{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11px;color:#81717e}
.calorie-manual-field input{background:#fff;border:1px solid #e5d5de;border-radius:8px;padding:9px 11px;direction:ltr;text-align:center;width:115px;max-width:100%;color:#524453;font-size:12px}
.calorie-hint{display:block;font-size:10px;color:#aa98a4;margin-top:7px;line-height:1.6}
.calendar-day.all-goals-met{background:#d9f3e2;color:#196742;border-color:#8dd2aa;box-shadow:0 0 0 1px #b5e5c5 inset}

.calendar-day.all-goals-met.selected .calendar-step-badge{color:#fff}
.calendar-day.all-goals-met.is-today:not(.selected){border-color:#37885e;color:#196742}
.calendar-water-badge{font-size:9px;line-height:1.05;white-space:nowrap;color:#2583b1;font-weight:800}
.calendar-day.selected .calendar-water-badge{color:#fff}
.calendar-water-recap,.calendar-calories-recap{background:#f6fbfe;border:1px solid #d9e9f3;border-radius:12px;padding:12px 14px;margin:0 0 13px;display:grid;gap:6px;color:#756775;font-size:12px}
.calendar-calories-recap{background:#fff9fb;border-color:#f3e5ea;margin-bottom:22px}
.calendar-water-recap strong,.calendar-calories-recap strong{font-size:13px;color:#564757}
.calendar-water-recap .goal-success,.calendar-calories-recap .goal-success{color:#288658;font-weight:800}
.calendar-water-recap .goal-pending{color:#a18548}
.legend-green{color:#258253!important;font-weight:700}
.legend-green i{width:10px;height:10px;border-radius:3px;background:#8fd1a8}
.recap-meal-calories{font-weight:600;color:#a97991;font-size:10px}

function calMeal(no){let c=(state.meals[state.date]||{})[no]||{};let estimated=(c.mode==='bar'&&c.snackbar)?210:Object.entries(c).reduce((v,[k,id])=>v+(k==='mode'||k==='snackbar'||k==='calorieOverride'?0:foodCal(id)),0);return c.calorieOverride!==undefined&&c.calorieOverride!==''?Number(c.calorieOverride):estimated;}
function complete(no,c={}){const has=k=>!!LABELS[c[k]];const veg=['veg1','veg2','veg3','veg4'].filter(has).length;const carb=()=>c.mode==='fat'?(has('fat1')&&has('fat2')):has('carb');if(no===1)return has('carb')&&has('protein1')&&has('veg1');if(no===2)return carb()&&has('protein1')&&has('protein2')&&veg>=3;if(no===3)return c.mode==='bar'?!!c.snackbar:carb()&&has('protein1');if(no===4)return has('protein1')&&veg>=3;return false;}
function nMeals(d){return [1,2,3,4].filter(no=>complete(no,state.meals[d]?.[no])).length;}
function greenDay(d){return nMeals(d)===4&&Number(state.steps?.[d])>=10000;}
function dayCals(){return [1,2,3,4].reduce((total,no)=>total+calMeal(no),0);}
function waterContent(){const v=state.water?.[state.date];const recorded=v!==undefined&&v!==null&&v!=='';const n=recorded?Number(v):0;const p=Math.min(100,n/30);return `<section class="steps-card water-card"><div class="steps-card-heading"><div class="steps-identity"><span class="steps-icon water-icon">💧</span><div><h2>המים שלי היום</h2><p>יעד: 3 ליטר</p></div></div><span class="steps-status ${!recorded?'not-set':n>=3000?'success':'pending'}">${!recorded?'טרם הוזנו מים':n>=3000?'✓ הגעת ליעד!':'בדרך ליעד'}</span></div><div class="steps-numbers"><strong>${recorded?(n/1000).toLocaleString('he-IL',{maximumFractionDigits:2}):'—'}</strong><span>מתוך 3 ליטר</span></div><div class="steps-progress water-progress"><div class="${n>=3000?'reached':''}" style="width:${p}%"></div></div><div class="steps-progress-foot"><span>${Math.round(p)}% מהיעד</span><span>${recorded?`${n.toLocaleString('he-IL')} מ״ל`:''}</span></div><div class="water-quick-add"><span>הוספה מהירה:</span>${[250,500,1000].map(x=>`<button type="button" class="btn btn-outline" data-add-water="${x}">+${x>=1000?'1 ליטר':`${x} מ״ל`}</button>`).join('')}</div><div class="steps-entry-form"><label for="previewWater">כמות מצטברת במ״ל</label><input id="previewWater" type="number" min="0" max="15000" step="1" data-water="1" value="${recorded?n:''}" placeholder="1500"/><span class="steps-save-note">✓ נשמר בדפדפן בלבד</span></div></section>`;}
const selected=(meal,key)=>(state.meals[state.date]||{})[meal]?.[key]||'';
function select(group,meal,key,title,optional=false){let value=selected(meal,key);return `<label class="food-field"><span>${title} ${optional?'<small>(רשות)</small>':''}</span><select class="food-select" data-meal="${meal}" data-key="${key}"><option value="">לבחירה מתוך הרשימה...</option>${GROUP[group].items.map(x=>`<option value="${x.id}" ${value===x.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select></label>`}
function veggies(meal,count){return `<div class="veg-fields">${Array.from({length:count},(_,i)=>select('veg',meal,'veg'+(i+1),'ירק '+(i+1),i===3)).join('')}</div>`}
function dual(a,b){return `<div class="dual">${a}${b}</div>`}
function meal(no,title,cal,desc,inner,emoji){const has=!!Object.values((state.meals[state.date]||{})[no]||{}).filter(x=>x&&x!=='carb'&&x!=='fat'&&x!=='bar').length;return `<article class="meal-card"><header class="meal-head"><div class="meal-head-main"><span class="meal-icon">${emoji}</span><div><h3>ארוחה ${no} · ${title}</h3><p>${desc}</p></div></div><div class="meal-head-side"><span class="pill pill-pink">${calMeal(no)} / ${cal} קק״ל</span>${has?'<span class="save-indicator saved">✓ נשמר מקומית</span>':''}</div></header><div class="meal-body">${inner}<div class="meal-calorie-box"><div class="meal-calorie-header"><div><strong>קלוריות בארוחה</strong><span>הערכה לפי מנות התחליפים, או ערך ידני</span></div><strong class="calorie-fraction">${calMeal(no)} / ${cal} קק״ל</strong></div><label class="calorie-manual-field">קלוריות מדויקות מהאריזה (לא חובה)<input type="number" min="0" max="5000" step="1" data-calories="${no}" placeholder="אומדן: ${calMeal(no)}" value="${state.meals[state.date]?.[no]?.calorieOverride??''}"/></label></div><footer class="meal-footer"><span>✓ בחירות אישיות</span><span>דמו · שמירה בדפדפן בלבד</span></footer></div></article>`}

function stepsContent(){const count=state.steps?.[state.date];const entered=count!==undefined&&count!==null&&count!=='';const n=entered?Number(count):null;const met=entered&&n>=10000;const pct=entered?Math.min(100,Math.max(0,n/100)):0;const fmt=n=>Number(n).toLocaleString('he-IL');return `<section class="steps-card" aria-label="מעקב צעדים יומי"><div class="steps-card-heading"><div class="steps-identity"><span class="steps-icon">👟</span><div><h2>הצעדים שלי היום</h2><p>יעד אישי: 10,000 צעדים בכל יום</p></div></div><span class="steps-status ${!entered?'not-set':met?'success':'pending'}">${!entered?'טרם הוזנו צעדים':met?'✓ עמדת ביעד!':'עדיין לא הגעת ליעד'}</span></div><div class="steps-numbers"><strong>${entered?fmt(n):'—'}</strong><span>מתוך 10,000 צעדים</span></div><div class="steps-progress"><div class="${met?'reached':''}" style="width:${pct}%"></div></div><div class="steps-progress-foot"><span>${Math.round(pct)}% מהיעד</span><span>${!entered?'הזיני את מספר הצעדים שלך':met?`מעבר ליעד ב־${fmt(n-10000)} צעדים`:`נשארו ${fmt(10000-n)} צעדים`}</span></div><div class="steps-summary-cta"><button class="btn btn-outline" data-page="stepsSummary">📈 סיכום צעדים שבועי וחודשי ←</button></div><div class="steps-entry-form"><label for="previewSteps">מספר צעדים בתאריך הנבחר</label><input id="previewSteps" data-steps="1" type="number" inputmode="numeric" min="0" max="200000" step="1" value="${entered?n:''}" placeholder="לדוגמה: 8500"><span class="steps-save-note">✓ השינוי יישמר בדפדפן בלבד</span></div><p class="steps-footnote">הזיני את מספר הצעדים באופן ידני. הנתונים נשמרים עבור היום שנבחר, בדפדפן הנוכחי בלבד.</p></section>`}
function mealContent(){let date=state.date;let m2=((state.meals[date]||{})[2]||{}).mode||'carb',m3=((state.meals[date]||{})[3]||{}).mode||'carb';let n=nMeals(date);return `<div class="section-head"><div><div class="eyebrow">התפריט היומי שלי</div><h1>היום בוחרת בשבילי 🌷</h1><p>ארבע ארוחות ביום · 1,200 קלוריות לפי התפריט</p></div></div><div class="date-toolbar"><div class="date-info"><span style="font-size:23px">🗓️</span><div><strong>${hebDate(date)}</strong><span>יום ${days.indexOf(date)+1} לתפריט</span></div></div><div class="date-actions"><button class="icon-btn" data-action="prev" ${date==='2026-11-01'?'disabled':''}>❯</button><input type="date" id="daypicker" min="2026-11-01" max="2026-11-30" value="${date}"/><button class="icon-btn" data-action="next" ${date==='2026-11-30'?'disabled':''}>❮</button></div></div><div class="daily-progress"><div class="daily-progress-title"><div><strong>הארוחות שלי</strong><span>${n}/4 ארוחות מלאות</span></div><span class="pill pill-pink">${dayCals()} / 1,200 קק״ל</span></div><div class="progress-track"><div style="width:${n*25}%"></div></div></div>${stepsContent()}${waterContent()}<div class="meal-stack">

${meal(3,'ארוחת ביניים',200,'פחמימה או 2 שומנים + חלבון קטן',switches(3,m3)+(m3==='bar'?`<label class="food-field"><span>חטיף חלבון במקום הארוחה</span><select data-meal="3" data-key="snackbar" class="food-select"><option value="">בחרי חטיף...</option><option value="חטיף חלבון עד 210 קק״ל" ${selected(3,'snackbar')?'selected':''}>חטיף חלבון עד 210 קק״ל</option></select></label>`:dual(m3==='carb'?select('carb',3,'carb','פחמימה'):dual(select('fat',3,'fat1','שומן 1'),select('fat',3,'fat2','שומן 2')),select('proteinSmall',3,'protein1','חלבון קטן'))),'🍓')}

ap"><strong>💧 מים ביום הזה</strong><span>${state.water?.[state.date]===undefined?'טרם דווחה שתייה':`${(Number(state.water[state.date])/1000).toLocaleString('he-IL',{maximumFractionDigits:2})} / 3 ליטר`}</span></div><div class="calendar-calories-recap"><strong>קלוריות לפי בחירות</strong><span>${dayCals()} / 1,200 קק״ל</span><span>${nMeals(state.date)}/4 ארוחות מלאות</span>${greenDay(state.date)?'<strong class="goal-success">✓ יום ירוק</strong>':''}</div><div class="recap-list">${[1,2,3,4].map(i=>`<div class="recap-item"><div class="recap-dot">${i}</div><div><strong>ארוחה ${i}</strong><p>${Object.entries(chosen[i]||{}).filter(([key,value])=>key!=='mode'&&key!=='calorieOverride'&&value).map(([key,value])=>esc(LABELS[value]||value)).join(' · ')||'לא נבחרו מאכלים'}</p></div></div>`).join('')}</div><button class="btn btn-primary full" data-page="meals">פתיחת התפריט לתאריך הזה ←</button></section></div>`}

function stepsSummaryContent(){const weekly=state.summaryScope==='week';const week=state.summaryWeek||'2026-11-01';const activeDates=weekly?days.slice(Math.max(0,days.indexOf(week)),Math.max(0,days.indexOf(week))+7):days;const info=summaryStats(activeDates);const counts=activeDates.map(d=>state.steps[d]===undefined?0:Number(state.steps[d]));const highest=Math.max(10000,...counts);const fmt=n=>Number(n).toLocaleString('he-IL');const daysCols=activeDates.map(d=>{let entered=state.steps[d]!==undefined&&state.steps[d]!=='';let n=entered?Number(state.steps[d]):0;return `<button class="step-chart-day" data-chart-day="${d}" title="${esc(hebDate(d))}: ${entered?fmt(n)+' צעדים':'אין דיווח'}"><span class="step-chart-value">${entered?fmt(n):'—'}</span><span class="step-chart-bar-wrap"><span class="step-chart-bar ${n>=10000&&entered?'achieved':entered?'not-met':'missing'}" style="height:${entered?Math.max(n===0?2:4,n/highest*100):0}%"></span></span><span class="step-chart-label">${weekly?['א','ב','ג','ד','ה','ו','ש'][new Date(d+'T12:00:00').getDay()]:Number(d.slice(-2))}</span><span class="step-chart-check">${entered&&n>=10000?'✓':' '}</span></button>`}).join('');return `<div class="section-head"><div><div class="eyebrow">סיכום הצעדים שלי</div><h1>כל צעד מצטבר להצלחה 👟</h1><p>ממוצע, סך צעדים, ימי עמידה ביעד וגרף ההתקדמות שלי.</p></div></div><section class="panel steps-summary-toolbar"><div class="steps-period-tabs"><button data-summary-scope="week" class="${weekly?'active':''}">סיכום שבועי</button><button data-summary-scope="month" class="${weekly?'':'active'}">סיכום חודשי</button></div><div class="steps-period-nav">${weekly?`<button class="icon-btn" data-summary-move="prev" ${week==='2026-11-01'?'disabled':''}>❯</button><strong>${previewShort(activeDates[0])} – ${previewShort(activeDates.at(-1))}</strong><button class="icon-btn" data-summary-move="next" ${week==='2026-11-29'?'disabled':''}>❮</button>`:'<strong>נובמבר 2026</strong>'}</div></section><div class="steps-summary-sta average===null?'—':fmt(st.average)}</td><td>${st.good}/${st.reported}</td><td><button class="btn btn-outline steps-week-button" data-week-jump="${start}">הצגת שבוע ←</button></td></tr>`}).join('')}</tbody></table></div></section>`}<section class="panel steps-summary-notes"><p>הממוצע ושיעור ימי ההצלחה מחושבים לפי ימים שבהם הזנת צעדים בלבד. חוסר דיווח אינו כישלון ביעד. בתצוגה הזו הנתונים נשמרים בדפדפן בלבד.</p></section></div>`}
function weightContent(){let entries=Object.entries(state.weights).filter(([d,v])=>v).sort(([a],[b])=>a.localeCompare(b));let base=state.weights['2026-11-01'];let latest=entries.at(-1);let delta=base&&latest?(Number(latest[1])-Number(base)).toFixed(1):'—';return `<div class="section-head"><div><div class="eyebrow">מסע המשקל</div><h1>כל צעד קטן הוא התקדמות</h1><p>שקילת פתיחה ב־1.11.2026, ואחריה בכל יום חמישי</p></div></div><div class="stats-grid"><div class="stat-card"><span>משקל התחלתי</span><strong>${base||'—'} <small>ק״ג</small></strong></div><div class="stat-card"><span>משקל אחרון</span><strong>${latest?latest[1]:'—'} <small>ק״ג</small></strong></div><div class="stat-card highlighted"><span>השינוי מההתחלה</span><strong>${delta} <small>ק״ג</small></strong></div></div><section class="panel"><div class="panel-top"><h2>טבלת השקילות</h2></div><div class="table-scroll"><table class="data-table"><thead><tr><th>תאריך</th><th>משקל בק״ג</th><th>מצב</th></tr></thead><tbody>${weeks.map(d=>`<tr><td>${hebDate(d)}</td><td><input class="table-input" data-weight="${d}" type="number" min="20" max="400" step="0.1" placeholder="למשל 80" value="${state.weights[d]||''}"/></td><td>${state.weights[d]?'✓ נשמר':'—'}</td></tr>`).join('')}</tbody></table></div><p class="fine-print">בדמו הזה השינוי נשמר בדפדפן שלך מיד לאחר הזנת הערך. באתר הענן תופיע שמירה מפורשת, יחד עם גרף.</p></section>`}
const M=[['right_arm','היקף זרוע ימין'],['chest','היקף חזה'],['narrow_waist','היקף בטן (אזור הצר)'],['navel_waist','היקף מותן (2 ס״מ מהטבור)'],['hips','היקף אגן (רגליים צמודות)'],['right_thigh','היקף ירך ימין']];
function measurementsContent(){let record=state.measurements[state.selectedWeek]||{};return `<div class="section-head"><div><div class="eyebrow">מעקב היקפים</div><h1>השינוי שלי בסנטימטרים</h1><p>מדידות שבועיות לפי תאריך</p></div></div><div class="panel"><div class="panel-top"><div><h2>בחרי שבוע למדידה</h2><p>כל שבוע נשמר בנפרד</p></div></div><div class="week-chips">${weeks.map(d=>`<button class="week-chip ${d===state.selectedWeek?'active':''}" data-week="${d}">${d.slice(-2)}.11 ${state.measurements[d]?'✓':''}</button>`).join('')}</div><h3 class="measure-date">${hebDate(state.selectedWeek)}</h3><div class="measure-form">${M.map(([k,label])=>`<label><span>${label}</span><div class="measure-input-wrap"><input type="number" min="10" max="300" step="0.1" data-measure="${k}" value="${record[k]??''}" placeholder="—"/><span>ס״מ</span></div></label>`).join('')}</div><p class="fine-print">הנתונים נשמרים מקומית בדפדפן. גרפי היקפים משותפים זמינים בגרסת הענן.</p></div>`}
function foodsContent(){return `<div class="section-head"><div><div class="eyebrow">המדריך האישי</div><h1>כל התחליפים במקום אחד</h1><p>160 אפשרויות בחירה, מתוך הרשימה שסיפקת</p></div></div><div class="panel food-filters"><div class="food-search"><input id="foodSearch" placeholder="חיפוש מזון..." value="${esc(state.q||'')}"/></div></div><div class="food-sections">${GROUPS.map(g=>{let items=g.items.filter(x=>!state.q||x.label.includes(state.q));if(!items.length)return '';return `<section class="panel food-group"><div class="food-group-heading"><div class="food-group-icon">${g.emoji}</div><div><h2>${g.title}</h2><p>${g.subtitle}</p></div><span class="pill pill-neutral">${items.length} אפשרויות</span></div><div class="food-list">${items.map(x=>`<div class="food-list-item"><span class="food-bullet"></span>${esc(x.label)}</div>`).join('')}</div></section>`}).join('')}</div>`}
function sharingContent(){return `<div class="section-head"><div><div class="eyebrow">פרטיות ושיתוף</div><h1>שיתוף התקדמות לפי הרשאה 🔐</h1><p>בגרסה המחוברת לענן אפשר להזמין משתמשות ולאשר גישה</p></div></div><section class="panel"><div class="empty-state"><span>💌</span><h3>שיתוף בהרשאה אישית</h3><p>בגרסת הענן תוכלי להזמין באמצעות אימייל, לבחור האם לשתף משקל ו/או היקפים, לשנות הרשאות ולבטל שיתוף. בדמו המקומי אין התחברות או שיתוף אמיתי.</p></div></section>`}
function render(){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));document.getElementById('topDate').textContent='יום '+(days.indexOf(state.date)+1)+' לתפריט · '+hebDate(state.date);document.getElementById('content').innerHTML=({meals:mealContent,calendar:calendarContent,stepsSummary:stepsSummaryContent,weight:weightContent,measurements:measurementsContent,foods:foodsContent,sharing:sharingContent})[state.page]();}
const root=document.getElementById('shell');
root.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;SAVE();render();window.scrollTo(0,0);return;}const action=e.target.closest('[data-action]');if(action){const i=days.indexOf(state.date)+(action.dataset.action==='next'?1:-1);if(days[i])state.date=days[i];SAVE();render();return;}const day=e.target.closest('[data-date]');if(day){state.date=day.dataset.date;SAVE();render();return;}const scope=e.target.closest('[data-summary-scope]');if(scope){state.summaryScope=scope.dataset.summaryScope;SAVE();render();return;}const prevNext=e.target.closest('[data-summary-move]');if(prevNext){const idx=summaryWeekStarts.indexOf(state.summaryWeek||'2026-11-01')+(prevNext.dataset.summaryMove==='next'?1:-1);if(summaryWeekStarts[idx])state.summaryWeek=summaryWeekStarts[idx];SAVE();render();return;}const weekJump=e.target.closest('[data-week-jump]');if(weekJump){state.summaryScope='week';state.summaryWeek=weekJump.dataset.weekJump;SAVE();render();return;}const chartDay=e.target.closest('[data-chart-day]');if(chartDay){state.date=chartDay.dataset.chartDay;state.page='meals';SAVE();render();return;}const waterAdd=e.target.closest('[data-add-water]');if(waterAdd){state.water ||= {};state.water[state.date]=Math.min(15000,(Number(state.water[state.date])||0)+Number(waterAdd.dataset.addWater));SAVE();render();return;}const week=e.target.closest('[data-week]');if(week){state.selectedWeek=week.dataset.week;SAVE();render();return;}const mode=e.target.closest('[data-mode]');if(mode){const m=mode.dataset.mode;state.meals[state.date] ||= {};state.meals[state.date][m]={mode:mode.dataset.to};SAVE();render();}});
root.addEventListener('change',e=>{const x=e.target;if(x.id==='daypicker'){state.date=x.value;SAVE();render();return;}if(x.dataset.meal){state.meals[state.date] ||= {};state.meals[state.date][x.dataset.meal] ||= {};state.meals[state.date][x.dataset.meal][x.dataset.key]=x.value;delete state.meals[state.date][x.dataset.meal].calorieOverride;SAVE();render();return;}if(x.dataset.calories){state.meals[state.date] ||= {};state.meals[state.date][x.dataset.calories] ||= {};if(x.value==='')delete state.meals[state.date][x.dataset.calories].calorieOverride;else if(Number.isSafeInteger(Number(x.value))&&Number(x.value)>=0&&Number(x.value)<=5000)state.meals[state.date][x.dataset.calories].calorieOverride=Number(x.value);SAVE();render();return;}if(x.dataset.water){if(x.value!==''&&(!Number.isSafeInteger(Number(x.value))||+x.value<0||+x.value>15000)){alert('הזיני כמות במ״ל בין 0 ל־15,000');render();return;}state.water ||= {};if(x.value==='')delete state.water[state.date];else state.water[state.date]=Number(x.value);SAVE();render();return;}if(x.dataset.steps){if(x.value!==''&&(!Number.isSafeInteger(Number(x.value))||+x.value<0||+x.value>200000)){alert('הזיני מספר צעדים שלם בין 0 ל־200,000');render();return;}state.steps ||= {};if(x.value==='')delete state.steps[state.date];else state.steps[state.date]=Number(x.value);SAVE();render();return;}if(x.dataset.weight){if(x.value&&(+x.value<20||+x.value>400)){alert('יש להזין משקל תקין');return;}state.weights[x.dataset.weight]=x.value;SAVE();render();return;}if(x.dataset.measure){state.measurements[state.selectedWeek] ||= {};state.measurements[state.selectedWeek][x.dataset.measure]=x.value;SAVE();render();}});
root.addEventListener('input',e=>{if(e.target.id==='foodSearch'){let cur=e.target.selectionStart;state.q=e.target.value;SAVE();render();const search=document.getElementById('foodSearch');search.focus();search.setSelectionRange(cur,cur);}});
render();
</script></body></html>
